      .flip-card {
        perspective: 1000px;
        height: clamp(320px, 55dvh, 380px);
      }
      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
        cursor: pointer;
      }
      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card-front,
      .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        border-radius: 1.5rem;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.05);
      }
      .flip-card-back {
        transform: rotateY(180deg);
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .sidebar-shell {
        visibility: hidden;
        transition: visibility 0s linear 450ms;
      }
      .sidebar-shell aside {
        transform: translateX(-100%);
        transition-duration: 360ms;
      }
      .js-sidebar-backdrop {
        opacity: 0;
        -webkit-backdrop-filter: blur(0);
        backdrop-filter: blur(0);
        transition:

          -webkit-backdrop-filter 450ms ease,
          backdrop-filter 450ms ease;

      .sidebar-shell.is-open {
        visibility: visible;
        transition-delay: 0s;
      }
      .sidebar-shell.is-open aside {
        transform: translateX(0);
      }
      .sidebar-shell.is-open .js-sidebar-backdrop {
        opacity: 1;
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
      }

        .sidebar-shell {

          transform: none;

    <script>
      (() => {
        const shell = document.querySelector(".sidebar-shell");
        const openButton = document.querySelector(".js-sidebar-open");
        const closeButtons = document.querySelectorAll(
          ".js-sidebar-close, .js-sidebar-backdrop",
        );
        const siteLink = document.querySelector(".js-site-link");
        const mobileTitle = document.querySelector(".js-mobile-site-title");

        if (!shell || !openButton) return;

        if (siteLink && mobileTitle) {
          mobileTitle.textContent = siteLink.textContent.trim();
        }

        const setSidebarOpen = (isOpen) => {
          shell.classList.toggle("is-open", isOpen);
          shell.setAttribute("aria-hidden", String(!isOpen));
          shell.inert = !isOpen;
          openButton.setAttribute("aria-expanded", String(isOpen));

          if (isOpen) {
            shell.querySelector(".js-sidebar-close")?.focus();
          } else {
            openButton.focus();
          }
        };

        openButton.addEventListener("click", () => setSidebarOpen(true));
        closeButtons.forEach((button) =>
          button.addEventListener("click", () => setSidebarOpen(false)),
        );
        shell.querySelectorAll("nav a").forEach((link) =>
          link.addEventListener("click", () => setSidebarOpen(false)),
        );
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && shell.classList.contains("is-open")) {
            setSidebarOpen(false);
          }
        });
        const syncSidebarWithViewport = () => {
          if (window.innerWidth >= 768) {
            shell.classList.remove("is-open");
            shell.setAttribute("aria-hidden", "false");
            shell.inert = false;
            openButton.setAttribute("aria-expanded", "false");
          } else if (!shell.classList.contains("is-open")) {
            shell.setAttribute("aria-hidden", "true");
            shell.inert = true;
          }
        };

        window.addEventListener("resize", syncSidebarWithViewport);
        syncSidebarWithViewport();
      })();
    </script>
