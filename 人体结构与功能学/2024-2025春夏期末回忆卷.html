                className="min-h-11 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors flex items-center gap-1"
              >
                <Layers size={16} /> <span className="hidden sm:inline">跳转题目</span><span className="sm:hidden">题目</span>
              </button>
              <div className="whitespace-nowrap px-3 py-2 bg-blue-50 text-blue-700 rounded-xl text-sm font-bold">
                <span className="hidden sm:inline">进度: </span>{currentIdx + 1} / {mcqs.length}
              </div>
            </div>
          </div>

          {/* 进度条 */}
          <div className="w-full h-2 bg-slate-200 rounded-full mb-5 sm:mb-8 overflow-hidden">
            <div
              className="h-full bg-blue-600 transition-all duration-300"
              style={{ width: `${((currentIdx + 1) / mcqs.length) * 100}%` }}
            ></div>
          </div>

          {!showResult ? (
            <div className="mobile-question-scroll">
              <div className="mb-4 sm:mb-6 bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-sm">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">
                    QUESTION {currentIdx + 1}
                  </span>
                  <span
                    className={`px-2 py-0.5 rounded-full text-xs font-bold ${

                    {getCorrectAnswers(mcqs[currentIdx]).length > 1

                  const isSelected = selectedOptions.includes(i);
                  const isCorrectOption = correctAnswers.includes(i);
                  let style =
                    "border-slate-200 bg-white hover:border-slate-300 hover:shadow-sm";
                  if (isAnswerSubmitted) {
                    if (isCorrectOption) {
                      style =
                        "border-emerald-500 bg-emerald-50 text-emerald-800 font-semibold";
                    } else if (isSelected) {
                      style =
                        "border-rose-500 bg-rose-50 text-rose-800 font-semibold";
                    } else {
                      style = "border-slate-100 bg-slate-50 text-slate-400";
                    }
                  } else if (isSelected) {
                    style =
                      "border-violet-500 bg-violet-50 text-violet-800 font-semibold shadow-sm";
                  }
                  return (
                    <button
                      key={i}
                      onClick={() => handleQuizAnswer(i)}
                      aria-pressed={isSelected}
                      disabled={isAnswerSubmitted}

                        <CheckCircle2 className="text-emerald-500 shrink-0 ml-3" />

                  {Math.round((score / mcqs.length) * 100)}%

                  正确题数:{" "}
                  <span className="font-bold text-emerald-600">{score}</span>
                </div>

                          {idx + 1}. {item.q}

                        </p>
                        <p className="text-emerald-600">

                        </p>

                  onClick={resetState}
                  className="min-h-12 w-full sm:w-auto px-6 py-3 bg-slate-100 text-slate-700 rounded-xl sm:rounded-full font-bold hover:bg-slate-200 transition-colors"

                  重新测试
                </button>
                <button
                  onClick={() => {
                    resetState();
                    setView("menu");

                  className="min-h-12 w-full sm:w-auto px-6 py-3 bg-blue-600 text-white rounded-xl sm:rounded-full font-bold hover:bg-blue-700 transition-colors shadow-md"
                >
                  返回主页

              </div>
            </div>

            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">

                <div className="p-4 sm:p-5 border-b flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Layers size={18} className="text-blue-500" />{" "}
                    选择题目录跳转

                    onClick={() => setShowNavModal(false)}
                    aria-label="关闭题目目录"

                    &times;
                  </button>
                </div>
                <div className="p-4 sm:p-6 pb-[max(1rem,env(safe-area-inset-bottom))] overflow-y-auto grid grid-cols-5 sm:grid-cols-6 gap-2">
                  {mcqs.map((_, i) => (
                    <button
                      key={i}

                      className={`min-h-11 py-2 text-sm font-bold rounded-lg border transition-all ${currentIdx === i ? "bg-blue-600 border-blue-600 text-white" : "border-slate-200 hover:border-blue-500 text-slate-700 hover:bg-slate-50"}`}
                    >
                      {i + 1}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    if (view === "flashcard") {
      return (

          {/* 导航头 */}
          <div className="flex items-center justify-between gap-2 mb-4 sm:mb-6">
            <button
              onClick={() => setView("menu")}
              className="min-h-11 shrink-0 text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1 font-medium"
            >
              <ChevronLeft size={18} /> 返回主页
            </button>

            <div className="flex min-w-0 items-center gap-2 sm:gap-3">
              <button
                onClick={() => setShowNavModal(true)}
                className="min-h-11 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors flex items-center gap-1"
              >
                <Layers size={16} /> <span className="hidden sm:inline">选卡列表</span><span className="sm:hidden">选卡</span>

              <div className="whitespace-nowrap px-3 py-2 bg-emerald-50 text-emerald-700 rounded-xl text-sm font-bold">

            </div>
          </div>

          {/* 进度条 */}
          <div className="w-full h-2 bg-slate-200 rounded-full mb-5 sm:mb-8 overflow-hidden">
            <div
              className="h-full bg-emerald-600 transition-all duration-300"
              style={{

              }}
            ></div>

          {/* 翻转卡片结构 */}
          <div

            <div className="flip-card-inner">
              {/* 卡片正面 (问题) */}
              <div className="flip-card-front bg-white border border-slate-200 text-slate-800 flex flex-col justify-between">
                <div className="p-3 bg-emerald-50 text-emerald-500 rounded-full mt-4 self-center">
                  <Lightbulb size={28} />
                </div>
                <div className="my-auto min-h-0 w-full overflow-y-auto overscroll-contain px-2 py-2 scrollbar-hide sm:px-4">
                  <span className="text-xs font-bold text-slate-400 block mb-2">
                    QUESTION {currentIdx + 1}
                  </span>
                  <h3 className="text-lg sm:text-xl font-bold leading-relaxed break-words">
                    {flashcards[currentIdx].q}
                  </h3>
                </div>
                <p className="text-slate-400 text-xs font-medium pb-4 flex items-center gap-1 animate-pulse">
                  <svg
                    className="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      strokeWidth="2"
                      d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"
                    />
                  </svg>
                  点击卡片翻看参考答案

              </div>

              {/* 卡片背面 (要点解析) */}
              <div className="flip-card-back bg-slate-900 text-white border border-slate-800 text-left items-start overflow-y-auto scrollbar-hide flex flex-col justify-between">
                <div className="w-full">
                  <h4 className="text-emerald-400 font-bold mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                    <CheckCircle2 size={18} /> 核心要点 / 答案分析
                  </h4>
                  <p className="text-base leading-relaxed text-slate-200 whitespace-pre-wrap font-medium">
                    {flashcards[currentIdx].a}

                </div>
                <p className="pt-6 text-slate-500 text-xs text-center w-full mt-auto">
                  点击卡片返回问题
                </p>
              </div>
            </div>
          </div>

          {/* 控制按钮 */}
          <div className="flex items-center justify-between gap-2 sm:gap-4 mt-5 sm:mt-8">
            <button
              disabled={currentIdx === 0}
              onClick={() => {

              className="min-h-12 flex flex-1 sm:flex-none items-center justify-center gap-1 sm:gap-2 px-3 sm:px-6 py-3 bg-white text-slate-600 hover:text-slate-800 border rounded-xl font-bold shadow-sm transition-all disabled:opacity-30 disabled:pointer-events-none"
            >
              <ChevronLeft size={20} /> 上一题
            </button>
            <button
              onClick={() => {
                if (currentIdx < flashcards.length - 1) {
                  setCurrentIdx(currentIdx + 1);
                  setFlipped(false);
                } else {
                  setView("menu");
                }
              }}
              className="min-h-12 flex flex-1 sm:flex-none items-center justify-center gap-1 sm:gap-2 px-3 sm:px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold shadow-sm transition-all"
            >
              {currentIdx === flashcards.length - 1 ? "完成复习" : "下一题"}{" "}
              <ChevronRight size={20} />
            </button>
          </div>

          {/* 简答题快速导航模态框 */}
          {showNavModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-2xl sm:rounded-2xl max-w-lg w-full max-h-[85dvh] overflow-hidden flex flex-col shadow-2xl">
                <div className="p-4 sm:p-5 border-b flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <Layers size={18} className="text-emerald-500" />{" "}
                    简答题卡片目录
                  </h3>
                  <button
                    onClick={() => setShowNavModal(false)}
                    aria-label="关闭卡片目录"
                    className="inline-flex h-11 w-11 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-200 text-2xl font-normal"
                  >
                    &times;
                  </button>
                </div>
                <div className="p-4 sm:p-6 pb-[max(1rem,env(safe-area-inset-bottom))] overflow-y-auto grid grid-cols-5 sm:grid-cols-6 gap-2">
                  {flashcards.map((_, i) => (
                    <button
                      key={i}
                      onClick={() => jumpToQuestion(i)}
                      className={`min-h-11 py-2 text-sm font-bold rounded-lg border transition-all ${currentIdx === i ? "bg-emerald-600 border-emerald-600 text-white" : "border-slate-200 hover:border-emerald-500 text-slate-700 hover:bg-slate-50"}`}
                    >
                      {i + 1}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
  }

  // 渲染 React 页面
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</main>
    </div>
    <script>
      (() => {
        const shell = document.querySelector(".sidebar-shell");
        const openButton = document.querySelector(".js-sidebar-open");
        const closeButtons = document.querySelectorAll(
          ".js-sidebar-close, .js-sidebar-backdrop",
        );
        const siteLink = document.querySelector(".js-site-link");
        const mobileTitle = document.querySelector(".js-mobile-site-title");

        if (!shell || !openButton) return;

        if (siteLink && mobileTitle) {
          mobileTitle.textContent = siteLink.textContent.trim();
        }

        const setSidebarOpen = (isOpen) => {
          shell.classList.toggle("is-open", isOpen);
          shell.setAttribute("aria-hidden", String(!isOpen));
          shell.inert = !isOpen;
          openButton.setAttribute("aria-expanded", String(isOpen));

          if (isOpen) {
            shell.querySelector(".js-sidebar-close")?.focus();
          } else {
            openButton.focus();
          }
        };

        openButton.addEventListener("click", () => setSidebarOpen(true));
        closeButtons.forEach((button) =>
          button.addEventListener("click", () => setSidebarOpen(false)),
        );
        shell.querySelectorAll("nav a").forEach((link) =>
          link.addEventListener("click", () => setSidebarOpen(false)),
        );
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && shell.classList.contains("is-open")) {
            setSidebarOpen(false);
          }
        });
        const syncSidebarWithViewport = () => {
          if (window.innerWidth >= 768) {
            shell.classList.remove("is-open");
            shell.setAttribute("aria-hidden", "false");
            shell.inert = false;
            openButton.setAttribute("aria-expanded", "false");
          } else if (!shell.classList.contains("is-open")) {
            shell.setAttribute("aria-hidden", "true");
            shell.inert = true;
          }
        };

        window.addEventListener("resize", syncSidebarWithViewport);
        syncSidebarWithViewport();
      })();
    </script>
  </body>
</html>
